[package]
name = "Gamekit"
module_roots = ["src", "tools", "tests"]

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "5db3d3c39425d5dfe4bfe4a84e6f6e2e5a810ad0"

[exports]
contract = "src/gamekit_contract.zi"
host = "src/gamekit_host.zi"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "894f1bc6b7a0fb0e9db6f668fe20f76581f61736"

[dependencies.apps]
git = "https://git.waozi.xyz/waozi/apps.git"
ref = "38e8fcef403e4ca271b5ffa68e9da60dfceab909"

[dependencies.crypto]
git = "https://git.waozi.xyz/ziranlang/crypto.git"
ref = "944826f70779a6b6cd53f6b06a75b36f4d8a2558"

# `ziran tool gamekit pack MANIFEST OUTPUT` packs a game from its own project.
[tool]
project = "build/bin/gamekit"
