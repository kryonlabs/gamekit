[package]
name = "Gamekit"
module_roots = ["src", "tools", "tests"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "f9f92b46db88b48cede41a6feb560915972b2ce6"

[exports]
contract = "src/gamekit_contract.zi"
host = "src/gamekit_host.zi"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "b45cc52456775dac23062979888ee04c5537b078"

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
ref = "352901ebf97ef3570971bf999367c82171cabf9a"

[dependencies.crypto]
git = "https://github.com/ziranlang/crypto.git"
ref = "944826f70779a6b6cd53f6b06a75b36f4d8a2558"

# `ziran tool gamekit pack MANIFEST OUTPUT` packs a game from its own project.
[tool]
project = "build/bin/gamekit"
